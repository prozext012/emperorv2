<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#e8d48b" />
<link rel="manifest" id="pwaManifestLink" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="dixzpays-vip" />
<title>Admin - Notifikasi & Testimoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
        --bg-base: #f5f4f0; --light: #fefefe; --dark: #2c2c2c;
        --primary: #e8d48b; --green: #5fba8f; --soft-red: #e57373;
    }
    body { background: var(--bg-base); font-family: 'Poppins', sans-serif; min-height: 100vh; padding: 20px 20px 100px; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.3rem; font-weight: 800; color: var(--dark); margin-bottom: 20px; }
    .tab-page { display: none; }
    .tab-page.active { display: block; }

    .card {
        background: var(--light); border: 3px solid var(--dark); border-radius: 16px;
        padding: 16px; margin-bottom: 20px; box-shadow: 5px 5px 0px rgba(44,44,44,0.2);
    }
    .card h2 { font-size: 1rem; font-weight: 700; color: var(--dark); margin-bottom: 12px; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #555; margin: 10px 0 4px; }
    input[type="text"], textarea, select, input[type="number"] {
        width: 100%; padding: 10px 12px; border: 2px solid var(--dark); border-radius: 10px;
        font-family: 'Poppins', sans-serif; font-size: 0.85rem; background: var(--bg-base); color: var(--dark);
    }
    textarea { min-height: 80px; resize: vertical; }
    input[type="file"] { width: 100%; font-size: 0.78rem; margin-top: 4px; }
    .preview-img { width: 100%; max-height: 180px; object-fit: contain; margin-top: 8px; border-radius: 10px; display: none; background: #eee; }
    .btn {
        margin-top: 14px; width: 100%; padding: 12px; border: 3px solid var(--dark); border-radius: 12px;
        background: var(--primary); color: var(--dark); font-weight: 700; font-size: 0.9rem;
        cursor: pointer; box-shadow: 3px 3px 0px rgba(44,44,44,0.3);
    }
    .btn.secondary { background: var(--light); }
    .btn.small { padding: 7px 10px; font-size: 0.72rem; margin-top: 0; width: auto; box-shadow: none; border-width: 2px; }
    .btn.danger { background: var(--soft-red); color: #fff; }

    .riwayat-item {
        border: 2px solid var(--dark); border-radius: 12px; padding: 10px; margin-bottom: 10px; background: var(--bg-base);
    }
    .riwayat-item img { width: 100%; max-height: 140px; object-fit: contain; border-radius: 8px; margin-bottom: 8px; background: #eee; }
    .riwayat-text { font-size: 0.8rem; color: var(--dark); margin-bottom: 6px; white-space: pre-wrap; }
    .riwayat-meta { font-size: 0.7rem; color: #999; margin-bottom: 8px; }
    .riwayat-actions { display: flex; gap: 8px; }

    .bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0; background: var(--light);
        border-top: 3px solid var(--dark); display: flex; justify-content: space-around;
        padding: 10px 0 max(10px, env(safe-area-inset-bottom)); z-index: 50;
    }
    .nav-btn {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        font-size: 0.68rem; font-weight: 600; color: #999; cursor: pointer;
    }
    .nav-btn svg { width: 22px; height: 22px; fill: #999; }
    .nav-btn.active { color: var(--dark); }
    .nav-btn.active svg { fill: var(--dark); }
    .empty-state { text-align: center; color: #999; font-size: 0.8rem; padding: 20px 0; }

    .notif-header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
    .notif-header-row h1 { margin-bottom: 0; }
    .status-toggle { display: flex; border: 2px solid var(--dark); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
    .status-btn {
        border: none; background: var(--light); color: #999; font-family: 'Poppins', sans-serif;
        font-size: 0.72rem; font-weight: 700; padding: 7px 10px; cursor: pointer;
    }
    .status-btn + .status-btn { border-left: 2px solid var(--dark); }
    .status-btn.active[data-val="true"] { background: var(--green); color: #fff; }
    .status-btn.active[data-val="false"] { background: var(--soft-red); color: #fff; }
</style>
</head>
<body>
<div class="container">

    <div class="tab-page active" id="pageNotif">
        <div class="notif-header-row">
            <h1>🔔 Input Notifikasi</h1>
            <div class="status-toggle" id="statusToggle">
                <button type="button" class="status-btn" data-val="true" id="btnStatusOnline">Online</button>
                <button type="button" class="status-btn" data-val="false" id="btnStatusOffline">Offline</button>
            </div>
        </div>
        <div class="card">
            <h2>Tambah Notifikasi</h2>
            <label>Gambar (opsional)</label>
            <input type="file" id="notifImgInput" accept="image/*" />
            <img class="preview-img" id="notifImgPreview" />
            <label>Teks deskripsi</label>
            <textarea id="notifDescInput" placeholder="Tulis isi notifikasi..."></textarea>
            <button class="btn" id="btnSubmitNotif">Kirim Notifikasi</button>
        </div>
        <h2 style="margin-bottom:10px;">Riwayat Notifikasi</h2>
        <div id="notifRiwayat"></div>
    </div>

    <div class="tab-page" id="pageTesti">
        <h1>⭐ Input Testimoni</h1>
        <div class="card">
            <h2>Tambah Testimoni</h2>
            <label>Nama produk</label>
            <select id="testiProdukInput"></select>
            <label>Foto transaksi</label>
            <input type="file" id="testiImgInput" accept="image/*" />
            <img class="preview-img" id="testiImgPreview" />
            <label>Bintang (3-5)</label>
            <input type="number" id="testiStarsInput" min="3" max="5" value="5" />
            <button class="btn" id="btnSubmitTesti">Kirim Testimoni</button>
            <button class="btn secondary" id="btnImportLegacy">Import Testimoni Lama (sekali saja)</button>
        </div>
        <h2 style="margin-bottom:10px;">Riwayat Testimoni</h2>
        <div id="testiRiwayat"></div>
    </div>

    <div class="tab-page" id="pageProfil">
        <h1>👤 Edit Profil</h1>
        <div class="card">
            <h2>Data Profil Website Utama</h2>
            <label>Foto profil</label>
            <input type="file" id="profilAvatarInput" accept="image/*" />
            <img class="preview-img" id="profilAvatarPreview" />
            <label>Banner</label>
            <input type="file" id="profilBannerInput" accept="image/*" />
            <img class="preview-img" id="profilBannerPreview" />
            <label>Nama</label>
            <input type="text" id="profilNamaInput" placeholder="Nama" />
            <label>Bio</label>
            <textarea id="profilBioInput" placeholder="Bio..."></textarea>
            <button class="btn" id="btnSubmitProfil">Simpan Perubahan</button>
        </div>
    </div>

</div>

<div class="bottom-nav">
    <div class="nav-btn active" id="navNotif">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        Notifikasi
    </div>
    <div class="nav-btn" id="navTesti">
        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        Testimoni
    </div>
    <div class="nav-btn" id="navProfil">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        Profil
    </div>
</div>

<script type="module">
    // ===== PWA: manifest + service worker + ikon, semua inline (1 file) =====
    (function setupPWA() {
        function makeIconDataUrl(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            // background rounded, warna primary tema web
            const r = size * 0.22;
            ctx.fillStyle = '#e8d48b';
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.arcTo(size, 0, size, size, r);
            ctx.arcTo(size, size, 0, size, r);
            ctx.arcTo(0, size, 0, 0, r);
            ctx.arcTo(0, 0, size, 0, r);
            ctx.closePath();
            ctx.fill();
            // ikon lonceng notifikasi, warna dark tema web
            ctx.fillStyle = '#2c2c2c';
            ctx.save();
            const scale = size / 24;
            ctx.translate(size * 0.18, size * 0.18);
            ctx.scale(scale * 0.64, scale * 0.64);
            const bell = new Path2D('M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z');
            ctx.fill(bell);
            ctx.restore();
            return canvas.toDataURL('image/png');
        }

        try {
            const icon192 = makeIconDataUrl(192);
            const icon512 = makeIconDataUrl(512);
            const base = location.href.split('#')[0].split('?')[0];
            const scope = new URL('.', base).href;
            const manifest = {
                id: base,
                name: 'dixzpays-vip',
                short_name: 'dixzpays-vip',
                description: 'Panel admin notifikasi & testimoni dixzpays-vip',
                start_url: base,
                scope: scope,
                display: 'standalone',
                background_color: '#f5f4f0',
                theme_color: '#e8d48b',
                icons: [
                    { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
                    { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
                    { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
                    { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const link = document.getElementById('pwaManifestLink');
            link.href = URL.createObjectURL(manifestBlob);

            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon';
            linkIcon.href = icon192;
            document.head.appendChild(linkIcon);
            const linkApple = document.createElement('link');
            linkApple.rel = 'apple-touch-icon';
            linkApple.href = icon192;
            document.head.appendChild(linkApple);

            if ('serviceWorker' in navigator) {
                const swCode = "self.addEventListener('install',e=>self.skipWaiting());" +
                    "self.addEventListener('activate',e=>self.clients.claim());" +
                    "self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});";
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(err => console.warn('Service worker gagal didaftarkan:', err));
            }
        } catch (err) {
            console.warn('Setup PWA gagal, web tetap jalan normal:', err);
        }
    })();

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
        getFirestore, collection, addDoc, doc, setDoc, updateDoc, deleteDoc,
        onSnapshot, query, orderBy, getDocs, where
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDztQD-U1k8Oz1Vnw7z3yUKzSzSP0RN1vg",
        authDomain: "kasir-warung-c9479.firebaseapp.com",
        projectId: "kasir-warung-c9479",
        storageBucket: "kasir-warung-c9479.firebasestorage.app",
        messagingSenderId: "765164639630",
        appId: "1:765164639630:web:f7f4fefd1753bfc0e080df",
        measurementId: "G-739VXW44QZ"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ===== NAVIGASI BOTTOM TAB =====
    const tabPairs = [
        { page: document.getElementById('pageNotif'), nav: document.getElementById('navNotif') },
        { page: document.getElementById('pageTesti'), nav: document.getElementById('navTesti') },
        { page: document.getElementById('pageProfil'), nav: document.getElementById('navProfil') }
    ];
    tabPairs.forEach(t => {
        t.nav.onclick = () => tabPairs.forEach(o => {
            o.page.classList.toggle('active', o === t);
            o.nav.classList.toggle('active', o === t);
        });
    });

    // ===== PREVIEW GAMBAR =====
    function wirePreview(inputId, previewId) {
        const input = document.getElementById(inputId);
        const preview = document.getElementById(previewId);
        input.addEventListener('change', () => {
            const file = input.files[0];
            if (!file) { preview.style.display = 'none'; return; }
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        });
    }
    wirePreview('notifImgInput', 'notifImgPreview');
    wirePreview('testiImgInput', 'testiImgPreview');
    wirePreview('profilAvatarInput', 'profilAvatarPreview');
    wirePreview('profilBannerInput', 'profilBannerPreview');

    // ===== SINKRON DAFTAR PRODUK OTOMATIS (dari web utama, lewat koleksi productMeta) =====
    window.__productMap = {}; // key -> nama
    const testiProdukSelect = document.getElementById('testiProdukInput');
    onSnapshot(query(collection(db, 'productMeta'), orderBy('id')), (snap) => {
        window.__productMap = {};
        const currentVal = testiProdukSelect.value;
        testiProdukSelect.innerHTML = '';
        snap.forEach(docSnap => {
            const p = docSnap.data();
            window.__productMap[p.key] = p.name;
            const opt = document.createElement('option');
            opt.value = p.key;
            opt.textContent = p.name;
            testiProdukSelect.appendChild(opt);
        });
        if (currentVal && window.__productMap[currentVal]) testiProdukSelect.value = currentVal;
    });

    // ===== TOGGLE STATUS ONLINE / OFFLINE (dipantulkan ke website utama) =====
    const btnStatusOnline = document.getElementById('btnStatusOnline');
    const btnStatusOffline = document.getElementById('btnStatusOffline');
    function setStatusUI(online) {
        btnStatusOnline.classList.toggle('active', online);
        btnStatusOffline.classList.toggle('active', !online);
    }
    onSnapshot(doc(db, 'settings', 'status'), (snap) => {
        setStatusUI(snap.exists() ? (snap.data().online !== false) : true);
    });
    btnStatusOnline.addEventListener('click', () => setDoc(doc(db, 'settings', 'status'), { online: true }, { merge: true }));
    btnStatusOffline.addEventListener('click', () => setDoc(doc(db, 'settings', 'status'), { online: false }, { merge: true }));

    // ===== TAB PROFIL: preload data saat ini + simpan perubahan =====
    let currentProfil = {};
    onSnapshot(doc(db, 'settings', 'profile'), (snap) => {
        currentProfil = snap.exists() ? snap.data() : {};
        const namaEl = document.getElementById('profilNamaInput');
        const bioEl = document.getElementById('profilBioInput');
        const avatarPrev = document.getElementById('profilAvatarPreview');
        const bannerPrev = document.getElementById('profilBannerPreview');
        // jangan timpa yang lagi diketik user; cuma isi kalau field masih kosong
        if (document.activeElement !== namaEl && !namaEl.value) namaEl.value = currentProfil.nama || '';
        if (document.activeElement !== bioEl && !bioEl.value) bioEl.value = currentProfil.bio || '';
        if (currentProfil.avatar) { avatarPrev.src = currentProfil.avatar; avatarPrev.style.display = 'block'; }
        if (currentProfil.banner) { bannerPrev.src = currentProfil.banner; bannerPrev.style.display = 'block'; }
    });

    document.getElementById('btnSubmitProfil').addEventListener('click', async () => {
        const btn = document.getElementById('btnSubmitProfil');
        const nama = document.getElementById('profilNamaInput').value.trim();
        const bio = document.getElementById('profilBioInput').value.trim();
        const avatarFile = document.getElementById('profilAvatarInput').files[0];
        const bannerFile = document.getElementById('profilBannerInput').files[0];
        btn.disabled = true; btn.textContent = 'Menyimpan...';
        try {
            const update = {};
            if (nama) update.nama = nama;
            if (bio) update.bio = bio;
            if (avatarFile) update.avatar = await fileToBase64IfAny(avatarFile);
            if (bannerFile) update.banner = await fileToBase64IfAny(bannerFile);
            await withTimeout(
                setDoc(doc(db, 'settings', 'profile'), update, { merge: true }),
                15000, 'Simpan ke database'
            );
            alert('Profil berhasil disimpan.');
            document.getElementById('profilAvatarInput').value = '';
            document.getElementById('profilBannerInput').value = '';
        } catch (e) {
            console.error('Gagal simpan profil:', e);
            alert('Gagal menyimpan profil: ' + e.message);
        }
        btn.disabled = false; btn.textContent = 'Simpan Perubahan';
    });

    function withTimeout(promise, ms, label) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} kelamaan (>${ms/1000}dtk). Cek koneksi internet ya.`)), ms))
        ]);
    }

    // Gambar disimpan langsung sebagai base64 di dalam data notifikasi/testimoni
    // (dikecilkan dulu biar gak kelewat besar buat 1 dokumen Firestore).
    function fileToCompressedBase64(file, maxWidth = 1000, quality = 0.72) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
            reader.onload = (e) => {
                const img = new Image();
                img.onerror = () => reject(new Error('Gagal memuat gambar.'));
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function fileToBase64IfAny(file) {
        if (!file) return '';
        const base64 = await withTimeout(fileToCompressedBase64(file), 20000, 'Proses gambar');
        if (base64.length > 900000) {
            throw new Error('Ukuran gambar masih terlalu besar setelah dikecilkan, coba pakai foto lain.');
        }
        return base64;
    }

    function formatWaktu(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return d.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // ===== NOTIFIKASI: SUBMIT =====
    document.getElementById('btnSubmitNotif').addEventListener('click', async () => {
        const btn = document.getElementById('btnSubmitNotif');
        const descEl = document.getElementById('notifDescInput');
        const imgFile = document.getElementById('notifImgInput').files[0];
        const desc = descEl.value.trim();
        if (!desc) { alert('Teks deskripsi wajib diisi.'); return; }
        btn.disabled = true; btn.textContent = 'Mengirim...';
        try {
            const imgUrl = await fileToBase64IfAny(imgFile);
            await withTimeout(
                addDoc(collection(db, 'notifikasi'), { desc, img: imgUrl, createdAt: Date.now() }),
                15000, 'Simpan ke database'
            );
            descEl.value = '';
            document.getElementById('notifImgInput').value = '';
            document.getElementById('notifImgPreview').style.display = 'none';
        } catch (e) {
            console.error('Gagal kirim notifikasi:', e);
            alert('Gagal mengirim notifikasi: ' + e.message);
        }
        btn.disabled = false; btn.textContent = 'Kirim Notifikasi';
    });

    // ===== NOTIFIKASI: RIWAYAT (realtime) =====
    const notifRiwayat = document.getElementById('notifRiwayat');
    onSnapshot(query(collection(db, 'notifikasi'), orderBy('createdAt', 'desc')), (snap) => {
        notifRiwayat.innerHTML = '';
        if (snap.empty) { notifRiwayat.innerHTML = '<div class="empty-state">Belum ada riwayat.</div>'; return; }
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const item = document.createElement('div');
            item.className = 'riwayat-item';
            item.innerHTML = `
                ${d.img ? `<img src="${d.img}" />` : ''}
                <div class="riwayat-text">${(d.desc || '').replace(/</g, '&lt;')}</div>
                <div class="riwayat-meta">${formatWaktu(d.createdAt)}</div>
                <div class="riwayat-actions">
                    <button class="btn small secondary" data-act="edit">Edit Teks</button>
                    <button class="btn small secondary" data-act="editfoto">Edit Foto</button>
                    <button class="btn small danger" data-act="del">Hapus</button>
                </div>
                <input type="file" accept="image/*" style="display:none" data-act="fileinput" />
            `;
            item.querySelector('[data-act="edit"]').onclick = async () => {
                const newDesc = prompt('Edit teks notifikasi:', d.desc || '');
                if (newDesc === null) return;
                await updateDoc(doc(db, 'notifikasi', docSnap.id), { desc: newDesc });
            };
            const fileInput = item.querySelector('[data-act="fileinput"]');
            item.querySelector('[data-act="editfoto"]').onclick = () => fileInput.click();
            fileInput.onchange = async () => {
                const file = fileInput.files[0];
                if (!file) return;
                try {
                    const base64 = await fileToBase64IfAny(file);
                    await updateDoc(doc(db, 'notifikasi', docSnap.id), { img: base64 });
                } catch (e) {
                    alert('Gagal mengganti foto: ' + e.message);
                }
            };
            item.querySelector('[data-act="del"]').onclick = async () => {
                if (!confirm('Hapus notifikasi ini?')) return;
                await deleteDoc(doc(db, 'notifikasi', docSnap.id));
            };
            notifRiwayat.appendChild(item);
        });
    });

    // ===== TESTIMONI: SUBMIT =====
    document.getElementById('btnSubmitTesti').addEventListener('click', async () => {
        const btn = document.getElementById('btnSubmitTesti');
        const productId = document.getElementById('testiProdukInput').value;
        const imgFile = document.getElementById('testiImgInput').files[0];
        let stars = parseInt(document.getElementById('testiStarsInput').value, 10) || 5;
        stars = Math.min(5, Math.max(3, stars));
        if (!imgFile) { alert('Foto transaksi wajib diisi.'); return; }
        btn.disabled = true; btn.textContent = 'Mengirim...';
        try {
            const imgUrl = await fileToBase64IfAny(imgFile);
            await withTimeout(
                addDoc(collection(db, 'testimoni'), { productId, img: imgUrl, stars, createdAt: Date.now(), legacy: false }),
                15000, 'Simpan ke database'
            );
            document.getElementById('testiImgInput').value = '';
            document.getElementById('testiImgPreview').style.display = 'none';
        } catch (e) {
            console.error('Gagal kirim testimoni:', e);
            alert('Gagal mengirim testimoni: ' + e.message);
        }
        btn.disabled = false; btn.textContent = 'Kirim Testimoni';
    });

    // ===== TESTIMONI: IMPORT DATA LAMA (sekali saja) =====
    const legacyApkJam = [
        "https://i.ibb.co.com/1J0VmFw9/IMG-20260710-182323-507.jpg",
        "https://i.ibb.co.com/xSGJKTWF/IMG-20260710-182353-008.jpg",
        "https://i.ibb.co.com/ym388RmY/IMG-20260710-182444-954.jpg",
        "https://i.ibb.co.com/9mpz0kwN/IMG-20260710-182507-305.jpg",
        "https://i.ibb.co.com/QjzhTXC1/IMG-20260710-182529-021.jpg",
        "https://i.ibb.co.com/TBLGXHKR/IMG-20260710-182544-870.jpg",
        "https://i.ibb.co.com/kVLK16SP/IMG-20260710-182605-318.jpg",
        "https://i.ibb.co.com/6RNz91Zv/IMG-20260710-182625-762.jpg",
        "https://i.ibb.co.com/JwRrkGyF/IMG-20260710-182658-357.jpg",
        "https://i.ibb.co.com/WNFn6XB9/IMG-20260710-182716-521.jpg"
    ];
    const legacyIg = ["https://i.ibb.co.com/yFpCBP5h/IMG-20260710-184434-523.jpg"];

    document.getElementById('btnImportLegacy').addEventListener('click', async () => {
        const existing = await getDocs(query(collection(db, 'testimoni'), where('legacy', '==', true)));
        if (!existing.empty) {
            if (!confirm('Data lama kelihatannya sudah pernah diimport. Import ulang lagi (bisa dobel)?')) return;
        }
        const btn = document.getElementById('btnImportLegacy');
        btn.disabled = true; btn.textContent = 'Mengimport...';
        let t = Date.now() - 100000;
        for (const img of legacyApkJam) {
            await addDoc(collection(db, 'testimoni'), { productId: 'apk-jam', img, stars: 5, createdAt: t++, legacy: true });
        }
        for (const img of legacyIg) {
            await addDoc(collection(db, 'testimoni'), { productId: 'ig', img, stars: 5, createdAt: t++, legacy: true });
        }
        btn.disabled = false; btn.textContent = 'Import Testimoni Lama (sekali saja)';
        alert('Import selesai.');
    });

    // ===== TESTIMONI: RIWAYAT (realtime) =====
    const testiRiwayat = document.getElementById('testiRiwayat');
    onSnapshot(query(collection(db, 'testimoni'), orderBy('createdAt', 'desc')), (snap) => {
        testiRiwayat.innerHTML = '';
        if (snap.empty) { testiRiwayat.innerHTML = '<div class="empty-state">Belum ada riwayat.</div>'; return; }
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const item = document.createElement('div');
            item.className = 'riwayat-item';
            item.innerHTML = `
                ${d.img ? `<img src="${d.img}" />` : ''}
                <div class="riwayat-text">Produk: <b>${window.__productMap[d.productId] || d.productId}</b>${d.legacy ? ' <span style="color:#999;">(data lama)</span>' : ''}</div>
                <div class="riwayat-text">Bintang: ${'⭐'.repeat(d.stars || 5)}</div>
                <div class="riwayat-meta">${formatWaktu(d.createdAt)}</div>
                <div class="riwayat-actions">
                    <button class="btn small secondary" data-act="edit">Edit Bintang</button>
                    <button class="btn small danger" data-act="del">Hapus</button>
                </div>
            `;
            item.querySelector('[data-act="edit"]').onclick = async () => {
                const val = prompt('Ubah jumlah bintang (3-5):', d.stars || 5);
                if (val === null) return;
                let s = Math.min(5, Math.max(3, parseInt(val, 10) || 5));
                await updateDoc(doc(db, 'testimoni', docSnap.id), { stars: s });
            };
            item.querySelector('[data-act="del"]').onclick = async () => {
                if (!confirm('Hapus testimoni ini?')) return;
                await deleteDoc(doc(db, 'testimoni', docSnap.id));
            };
            testiRiwayat.appendChild(item);
        });
    });
</script>
</body>
</html>
